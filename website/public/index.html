<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pick AI History</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="loginScreen" class="login-screen" hidden>
  <div class="login-card">
    <h1>Pick AI History</h1>
    <p class="login-hint">Sign in to see your history.</p>
    <button id="googleSignIn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.95v2.33A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.05l3.02-2.33Z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/></svg>
      Continue with Google
    </button>
    <div class="login-divider"><span>or</span></div>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" />
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
    <div class="login-email-actions">
      <button id="loginSignIn" class="login-submit">Sign In</button>
      <button id="loginSignUp" class="login-secondary">Create Account</button>
    </div>
    <p id="loginError" class="login-error" hidden></p>
  </div>
</div>

<div id="passwordSetupModal" class="login-screen" hidden>
  <div class="login-card">
    <h1>Set a Password</h1>
    <p class="login-hint">
      You signed up with Google. Set a password too so you can also sign in from the Mac
      app, which only supports email/password.
    </p>
    <input id="setupPassword" type="password" placeholder="New password" autocomplete="new-password" />
    <button id="setupPasswordSubmit" class="login-submit">Set Password</button>
    <button id="setupPasswordSkip" class="login-secondary" style="margin-top: 8px; width: 100%;">Skip for now</button>
    <p id="setupPasswordError" class="login-error" hidden></p>
  </div>
</div>

<div id="appContent" hidden>
  <header>
    <div class="title-row">
      <h1>Pick AI History</h1>
      <div class="account">
        <span id="accountEmail" class="account-email"></span>
        <button id="signOutBtn" class="signout-btn">Sign Out</button>
      </div>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search questions and answers…" />
      <div class="filters">
        <button class="filter-btn active" data-mode="">All</button>
        <button class="filter-btn" data-mode="answer">Answer</button>
        <button class="filter-btn" data-mode="explain">Explain</button>
      </div>
      <select id="sortOrder" class="sort-select">
        <option value="desc">Newest first</option>
        <option value="asc">Oldest first</option>
      </select>
      <button id="selectToggleBtn" class="select-toggle-btn">Select</button>
    </div>
  </header>
  <div id="selectBar" class="select-bar" hidden>
    <span id="selectCount">0 selected</span>
    <div id="selectBarActions" class="select-bar-group">
      <button id="selectAllBtn" class="delete-cancel">Select All</button>
      <button id="selectDeleteBtn" class="delete-btn" disabled>Delete Selected</button>
      <button id="selectCancelBtn" class="delete-cancel">Cancel</button>
    </div>
    <div id="selectBarConfirm" class="select-bar-group" hidden>
      <span id="selectConfirmText"></span>
      <button id="selectDeleteCancelBtn" class="delete-cancel">Cancel</button>
      <button id="selectDeleteConfirmBtn" class="delete-confirm-btn">Delete</button>
    </div>
  </div>
  <main id="grid" class="grid"></main>
  <p id="empty" class="empty" hidden>No entries yet.</p>
  <div id="errorState" class="empty" hidden>
    Couldn't load history. <button id="retryBtn" class="load-more">Retry</button>
  </div>
  <button id="loadMore" class="load-more" hidden>Load more</button>

  <div id="modal" class="modal" hidden>
    <div class="modal-content">
      <button id="modalClose" class="modal-close">&times;</button>
      <img id="modalImage" class="modal-image" hidden />
      <p id="modalMeta" class="modal-meta"></p>
      <h2 id="modalQuestion"></h2>
      <p id="modalAnswer" class="modal-answer"></p>
      <div class="modal-footer">
        <button id="modalDelete" class="delete-btn">Delete</button>
        <div id="modalDeleteConfirm" class="delete-confirm" hidden>
          <span>Delete this entry?</span>
          <button id="modalDeleteCancel" class="delete-cancel">Cancel</button>
          <button id="modalDeleteConfirmBtn" class="delete-confirm-btn">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
